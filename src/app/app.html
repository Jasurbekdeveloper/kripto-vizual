<div class="shell" [class.menu-open]="menu()">
  <aside class="nav">
    <a class="brand" routerLink="/" (click)="menu.set(false)"><span class="logo">⟐</span> Kripto Vizual</a>
    @for (t of topics; track t.n) {
      <div class="nav-group">
        <div class="nav-topic"><span>{{ t.n }}</span>{{ t.title }}</div>
        @for (a of algos(t.n); track a.id) {
          <a [routerLink]="['/algo', a.id]" routerLinkActive="active" (click)="menu.set(false)">{{ a.name }}</a>
        }
      </div>
    }
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn icon burger" (click)="menu.set(!menu())" aria-label="Menyu">☰</button>
      <span class="top-title">Zamonaviy kriptografiya · IIAU</span>
      <button class="btn icon" (click)="toggleTheme()" [title]="dark() ? 'Yorug‘ rejim' : 'Qorong‘i rejim'">{{ dark() ? '☀' : '☾' }}</button>
    </header>
    <div class="content"><router-outlet /></div>
  </div>
  <div class="scrim" (click)="menu.set(false)"></div>
</div>
